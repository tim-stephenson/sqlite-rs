[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "sqlite-rs"
description = "A drop-in superset of Python's sqlite3 bindings, extended with Rust for performant Arrow interoperability."
# The project page on PyPI is this file; without it the page is blank.
readme = "README.md"
authors = [
    { name = "Timothy Stephenson", email = "38039215+tim-stephenson@users.noreply.github.com" }
]
license = "MIT"
# The two vendor/*/LICENSE globs cover the third-party code THIRD_PARTY_NOTICES
# describes (CPython's PSF License, typeshed's Apache License) -- included
# here (not just in the sdist) so the actual shipped wheel, which bundles
# compiled/copied code from both, carries their license text too.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "vendor/cpython/*/LICENSE", "vendor/typeshed/LICENSE"]
requires-python = ">=3.11"
dependencies = []
# No License classifier: `license` above is an SPDX expression (PEP 639), and
# the two together are an error in current tooling.
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/tim-stephenson/sqlite-rs"
Documentation = "https://tim-stephenson.github.io/sqlite-rs/"
Repository = "https://github.com/tim-stephenson/sqlite-rs"
Issues = "https://github.com/tim-stephenson/sqlite-rs/issues"


[dependency-groups]
test = [
    "pytest",
]
# Benchmarking only, and deliberately its own group: CI never installs it, so a
# package without wheels for every supported interpreter cannot gate the test
# matrix the way pyarrow once did.
bench = [
    "polars",
    # ADBC's SQLite driver is the near neighbour: it returns Arrow too, from
    # its own bundled SQLite. Its dbapi layer goes through pyarrow.
    "adbc-driver-sqlite",
    "pyarrow",
]
dev = [
    "maturin",
    "marimo",
    "sphinx",
    "ruff",
    "pydata-sphinx-theme",
    "sphinx-autobuild",
    "myst-parser",
    "basedpyright",
    {include-group = "test"},
]

[tool.ruff]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D100",
    "EXE001",
    # flake8-copyright: demands a copyright header at the top of every file.
    # Enabled only because `select = ["ALL"]` picks up new rules as ruff
    # releases them; nothing here wants per-file copyright notices.
    "CPY001",
    # Every urlopen() in scripts/ builds an https URL from a module constant,
    # so the "could be file: or a custom scheme" warning is a false positive.
    # Ignored project-wide rather than per-call: ruff 0.16 stopped flagging
    # some of these, which turned the old `# noqa: S310` comments into RUF100
    # "unused noqa" errors, so the suppression cannot live at the call site
    # and work across both ruff versions.
    "S310",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"docs/**/*.py" = ["INP001", "D103"]
"docs/source/notebooks/*.py" = ["ANN001", "ANN202", "B018", "PLC0415", "PLR1711"]
"tests/**/*.py" = ["S101", "D101", "D102", "D103", "D105", "INP001"]
"scripts/**/*.py" = ["T201", "D103"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "sqlite_rs._core"
# maturin's default wheel packaging uses `git ls-files` to decide what to
# include from python-source, so it respects .gitignore -- but build.rs
# materializes sqlite_rs/sqlite3/ (the CPython clone module) and the bundled
# libsqlite3 shared library at build time, and both are gitignored (they're
# generated, not source). Without forcing them back in, wheels silently ship
# without sqlite_rs.sqlite3 at all. shared_lib_name() in build.rs names the
# library sqlite_rs_libsqlite3.dll on Windows and libsqlite_rs_sqlite3.{so,
# dylib} elsewhere -- project-prefixed on every platform so it cannot collide
# with CPython's own bundled SQLite under a loader that matches by bare
# filename (Windows, musl; see that function's doc comment) -- so list all
# three rather than one glob that would miss a platform.
#
# format = "wheel" on every entry: without it, maturin applies this same
# force-include to the sdist too, which has no build step to freshly
# (re)generate these paths -- it just tars up whatever happens to be
# sitting there on disk, so it would ship whatever locally-built,
# platform-specific binaries (and __pycache__ cruft) happened to exist in a
# maintainer's working tree at sdist-build time (confirmed in practice).
# Scoping to "wheel" restores the sdist's normal git-tracked-files-only
# behavior, since these paths are meant to be regenerated by build.rs from
# vendor/ at build time, not shipped as source.
include = [
    { path = "python/sqlite_rs/sqlite3/**/*", format = "wheel" },
    { path = "python/sqlite_rs/libsqlite_rs_sqlite3.so", format = "wheel" },
    { path = "python/sqlite_rs/libsqlite_rs_sqlite3.dylib", format = "wheel" },
    { path = "python/sqlite_rs/sqlite_rs_libsqlite3.dll", format = "wheel" },
]

[tool.basedpyright]
# pytest puts the test directory on sys.path, so a test importing a sibling
# helper (arrow_util) is a plain top-level import at runtime. Tell basedpyright
# the same, rather than have it read those as implicitly relative.
# adbc_driver_sqlite ships no types, so every call through it in the benchmark
# reads as partially unknown. Nothing in scripts/ is imported by the package.
executionEnvironments = [
    { root = "tests", extraPaths = ["tests"] },
    # Two things nothing in scripts/ can satisfy on every platform at once:
    # adbc_driver_sqlite ships no types, and ctypes.windll exists only when the
    # checker believes it is on Windows -- which the benchmark reaches for
    # behind a sys.platform guard, for peak RSS. Whether an ignore comment on
    # that line is redundant depends on where the check runs, so that rule goes
    # too. Nothing here is imported by the package.
    { root = "scripts", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportAny = false, reportAttributeAccessIssue = false, reportUnnecessaryTypeIgnoreComment = false },
]
exclude = [
    "**/node_modules", 
    "**/__pycache__",
    "**/.*",
    "target",
    "vendor",
    "python/sqlite_rs/sqlite3",
    "docs/source/notebooks",
]

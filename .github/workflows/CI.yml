# This file is autogenerated by maturin v1.14.1
# To update, run
#
#    maturin generate-ci github
#
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# One run per ref at a time: a push to main used to leave every superseded run
# going, so several full matrices competed for the same runner pool and each
# took far longer than it needed to.
#
# cancel-in-progress is disabled for tags. A tag run is the one that builds
# release artifacts and publishes to PyPI, and cancelling that partway through
# would leave a half-uploaded release; tags also each have their own ref, so
# they never queue behind one another anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Single source of truth for which Python versions this project supports.
  #
  # GitHub Actions has no YAML anchors, so the only way to write a list once
  # and read it from several jobs is to emit it as job outputs and have every
  # consumer declare `needs: config`. Every other job below derives its
  # version list from here rather than spelling one out.
  #
  # Each output is the canonical list minus a named, commented exclusion set,
  # so adding or dropping a Python version is a one-line change to ALL and
  # every deviation from it stays explicit about *why* it deviates.
  # ---------------------------------------------------------------------------
  config:
    runs-on: ubuntu-latest
    outputs:
      # JSON arrays, for `matrix: python-version: ${{ fromJSON(...) }}`.
      all: ${{ steps.versions.outputs.all }}
      tested: ${{ steps.versions.outputs.tested }}
      tested_spaced: ${{ steps.versions.outputs.tested_spaced }}
      tested_windows: ${{ steps.versions.outputs.tested_windows }}
      # Space-separated, for maturin's `--interpreter`.
      all_spaced: ${{ steps.versions.outputs.all_spaced }}
      all_i_args: ${{ steps.versions.outputs.all_i_args }}
      cpython_source_built_i_args: ${{ steps.versions.outputs.cpython_source_built_i_args }}
    steps:
      - id: versions
        shell: bash
        run: |
          set -euo pipefail

          # >>> THE canonical list. Add or drop a Python version HERE, and
          # >>> nowhere else in this file.
          ALL="3.11 3.12 3.13 3.14 3.15 3.15t"

          # CPython only -- PyPy is deliberately not a supported target and is
          # neither built nor tested anywhere in this workflow. Every list
          # below is an explicit subset of ALL for exactly this reason: the
          # alternative, --find-interpreter, builds whatever an image happens
          # to carry, which silently pulled PyPy wheels into the linux legs.
          # (build.rs still carries PyPy handling for local/manual builds; it
          # is simply never exercised here.)

          # emit <output-name> [versions to exclude...]
          #
          # Writes three forms of ALL-minus-exclusions: a JSON array (for
          # matrix expansion), a space-separated string (for maturin) and a
          # newline-separated one (for setup-python).
          emit() {
            local name="$1"; shift
            local excluded=" $* "
            local keep="" v
            for v in $ALL; do
              case "$excluded" in
                *" $v "*) continue ;;
              esac
              keep="${keep:+$keep }$v"
            done
            {
              printf '%s=%s\n' "$name" \
                "$(printf '%s\n' $keep | jq -Rsc 'split("\n") | map(select(length > 0))')"
              printf '%s_spaced=%s\n' "$name" "$keep"
              printf '%s_i_args=%s\n' "$name" "$(for x in $keep; do printf -- '-i python%s ' "$x"; done)"
              printf '%s_lines<<__EOF__\n' "$name"
              printf '%s\n' $keep
              printf '__EOF__\n'
            } >> "$GITHUB_OUTPUT"
            printf '%-24s %s\n' "$name" "$keep" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo '### Python versions'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          emit all

          # Which interpreters a builder image actually carries comes down to
          # how that image got its /opt/python (see rust-cross/manylinux-cross's
          # render.py, which decides this per target). Every target here copies
          # /opt/python from a supported PyPA image and gets the full set --
          # except armv7, glibc and musl alike, which has no upstream PyPA image
          # in rust-cross's 2_28 group and so has its CPythons compiled from
          # source in the Dockerfile. That list is pinned at
          # 3.9.25/3.10.20/3.11.15/3.12.13/3.13.14/3.14.6, with no free-threaded
          # build of any version. So: no 3.15, no 3.15t.
          #
          # What would have to change for armv7 to get them -- none of it
          # fixable from here, so armv7 stays capped at 3.14 until one happens:
          #
          # (a) rust-cross adds 3.15 to the source-build blocks in its
          #     Dockerfile.j2, plus a second --disable-gil configure
          #     pass installed as /opt/python/cp315-cp315t for 3.15t.
          #     Today the file has one hardcoded block per version and
          #     stops at 3.14.6.
          # (b) Better: rust-cross stops source-building armv7 at all
          #     and COPYs /opt/python from PyPA instead, the way it
          #     already does for ppc64le and riscv64. The images exist
          #     and are actively rebuilt -- manylinux_2_31_armv7l,
          #     manylinux_2_35_armv7l and musllinux_1_2_armv7l were all
          #     republished 2026-09-14 and carry the full CPython set.
          #     The gap is purely one of tags: PyPA ships armv7l only
          #     on Debian-derivative bases (manylinux_2_31 is Ubuntu
          #     20.04, manylinux_2_35 is Ubuntu 22.04), because the
          #     RHEL-family bases behind manylinux2014/_2_28/_2_34/
          #     _2_39 have no armv7 build at all. So manylinux_2_28_
          #     armv7l does not and will not exist -- and armv7 sits in
          #     rust-cross's 2_28 group, where there is nothing to copy
          #     from. Moving it to their 2_31 or 2_35 group would fix
          #     it; note those tags mean a glibc 2.31/2.35 floor for
          #     armv7 specifically, above this project's 2.28.
          # (c) Failing both, this workflow could point armv7 at the
          #     native PyPA manylinux_2_31_armv7l image and run it
          #     under QEMU -- correct, but the emulation slowness this
          #     matrix was built to avoid.
          emit cpython_source_built 3.15 3.15t

          emit tested

          # Windows is the one exception: the test group's pywin32 -- needed
          # only on win32 -- has no free-threaded wheel for any CPython
          # version yet (confirmed in CI: "no wheels ... with Python ABI
          # tags: cp39, cp310, cp311, cp312, cp313, cp314, cp315" -- no
          # cp314t/cp315t), so 3.15t builds on Windows but isn't tested there.
          emit tested_windows 3.15t

          echo '```' >> "$GITHUB_STEP_SUMMARY"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Run ruff check
        run: uv run ruff check .
      - name: Run ruff format --check
        run: uv run ruff format --check .

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Build the extension module
        run: uv run maturin develop --uv
      - name: Run basedpyright
        run: uv run basedpyright . --warnings

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          # manylinux_2_28 (glibc 2.28, RHEL 8 era) is this project's declared
          # floor everywhere, rather than maturin-action's `auto`
          # (manylinux2014 / glibc 2.17). PyPA publishes an actively-built
          # manylinux_2_28_i686 as well as _x86_64, and both carry the full
          # CPython set, so nothing is lost by raising the floor here.
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: "2_28"
            pyset: all
          - runner: ubuntu-22.04
            target: x86
            manylinux: "2_28"
            pyset: all
          # armv7: manylinux2014-cross's bundled cross-gcc is too old to ship
          # stdatomic.h, which CPython 3.13+'s mimalloc allocator requires --
          # manylinux_2_28-cross bundles a newer one that has it (verified
          # against ghcr.io/rust-cross/manylinux_2_28-cross's actual published
          # tags -- it covers armv7 even though PyPA doesn't publish a
          # *native* manylinux_2_28_armv7l image). aarch64 used to be built
          # here too via manylinux_2_28-cross, but ubuntu-24.04-arm (a genuine
          # ARM64 GitHub-hosted runner) lets it build and test natively
          # instead -- no cross-gcc, no QEMU -- see the linux-aarch64 job
          # below. s390x and ppc64le were dropped outright: both are niche
          # enough that most of the scientific/Rust-extension ecosystem
          # (numpy, scipy, pandas, orjson, grpcio) ships no wheels for them.
          #
          # An explicit `--interpreter` list rather than --find-interpreter:
          # the latter doesn't actually scan these *-cross images' filesystem
          # for what interpreters are really present -- it optimistically
          # assumes a fixed set of "commonly available" tags for the target
          # triple and tries all of them regardless, so it always attempts
          # (and fails) a build for whichever aren't really there instead of
          # skipping them. What each image really carries is encoded in the
          # config job's outputs.
          - runner: ubuntu-22.04
            target: armv7
            manylinux: "2_28"
            pyset: source_built
          # riscv64 needs glibc new enough to have riscv64 support at all -- PyPA's
          # oldest riscv64 baseline is manylinux_2_39 (verified: no PyPA image
          # exists for any older manylinux_2_* tag).
          #
          # Unlike aarch64/armv7, `manylinux: "2_39"` alone picked
          # the *native* quay.io/pypa/manylinux_2_39_riscv64 image instead of the
          # *-cross one -- maturin-action's target-to-cross-image auto-mapping
          # apparently doesn't cover riscv64 yet, and running a genuine riscv64
          # container with no QEMU registered in this job fails immediately
          # ("exec format error"). Point at the -cross image explicitly instead.
          #
          # Its image copies /opt/python from the supported PyPA
          # manylinux_2_39_riscv64, so it carries the full CPython set.
          - runner: ubuntu-22.04
            target: riscv64
            manylinux: "2_39"
            container: ghcr.io/rust-cross/manylinux_2_39-cross:riscv64
            pyset: all
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      # These `manylinux:` values pick maturin-action's fast, natively-running
      # `*-cross` images (e.g. ghcr.io/rust-cross/manylinux_2_28-cross:s390x)
      # for non-x86 targets: a glibc x86_64 host with a cross-gcc bolted on, no
      # QEMU needed at all. build.rs's cross-Python lookup
      # (find_cross_python_executable / resolve_python) derives the target's
      # Python.h/pyconfig.h include dir and EXT_SUFFIX from the manylinux/
      # musllinux /opt/python/<tag>/ directory layout instead of executing the
      # (possibly foreign-architecture, since this image never runs under
      # QEMU) interpreter, so no target Python needs to actually run.
      #
      # --auditwheel=warn everywhere here: `manylinux:` being set at all makes
      # maturin auto-*repair* for compliance by default, which detects
      # _core's dependency on libsqlite3 and copies/renames it into a private
      # sqlite_rs.libs/ directory just for _core's own use -- while
      # sqlite_rs.sqlite3._sqlite3 (a plain C extension build.rs links
      # directly, outside maturin's own crate-tracking) and LIBSQLITE3_PATH
      # still expect the original, pyproject.toml-force-included copy. That
      # leaves two independently-loaded copies of SQLite in one process,
      # which segfaults the moment a raw sqlite3* crosses between them
      # (query_via_rust/get_raw_db_ptr) -- confirmed by CI (linux x86_64
      # passed every test except one, which crashed with "Fatal Python
      # error: Segmentation fault", right after this repair step's own log
      # showed it relocating libsqlite3.so). `--auditwheel=skip` also
      # avoids the repair, but throws out the wheel's manylinux compliance
      # *tag* entirely (falls back to a bare, PyPI/pip-rejected `linux_*`
      # tag) -- confirmed by CI (linux x86 failed to even install its own
      # just-built wheel: "sqlite-rs (v0.1.0) has no wheels with a matching
      # platform tag"). `warn` keeps the real compliance tag while only
      # skipping the problematic repair/relocation step.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist --auditwheel=warn
            ${{ matrix.platform.pyset == 'source_built'
            && needs.config.outputs.cpython_source_built_i_args
            || needs.config.outputs.all_i_args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
      # No test steps here: s390x/ppc64le/armv7/riscv64 are built via
      # cross-gcc for a CPU this runner can't execute at all (testing them
      # would need QEMU, the slowness this whole matrix was reworked to
      # avoid), x86 (i686) has no interpreter to install/run it against at
      # all -- unlike windows's actions/setup-python (which supports
      # architecture: x86), Linux runners have no 32-bit Python available
      # (confirmed in CI: "sqlite-rs (v0.1.0) has no wheels with a matching
      # platform tag" against the 64-bit interpreter actions/setup-python
      # actually provisions here) -- and x86_64 is tested in its own
      # dedicated test-linux-x86_64 job below (one job per Python version
      # actually built here, rather than the single "3.x" this job's own
      # setup-python happens to resolve).
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  linux-aarch64:
    # ubuntu-24.04-arm is a genuine ARM64 GitHub-hosted runner (GA and free
    # for public repos), so unlike the linux job's s390x/ppc64le/armv7/
    # riscv64 legs -- which have no native runner option and must cross-
    # compile via manylinux-cross images and skip testing entirely -- aarch64
    # can build against the real, native quay.io/pypa/manylinux_2_28_aarch64
    # image (maturin-action picks it automatically since manylinux: is set
    # and the runner's own arch already matches the target) and then actually
    # install and test the resulting wheel, no QEMU or cross-gcc involved.
    runs-on: ubuntu-24.04-arm
    needs: config
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      # manylinux_2_28_aarch64's /opt/python carries the same interpreter set
      # as the manylinux_2_28-cross images the linux job's other targets use
      # (confirmed from this job's own build log), so it shares their config
      # output rather than the full canonical list.
      #
      # --auditwheel=warn: see the matching comment in the linux job -- same
      # risk of maturin's manylinux auto-repair relocating libsqlite3 into a
      # private copy for _core alone, regardless of native vs cross build.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: >-
            --release --out dist --auditwheel=warn
            ${{ needs.config.outputs.all_i_args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: "2_28"
      # Tested in its own dedicated test-linux-aarch64 job below (one job per
      # Python version actually built here), not inline in this job.
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-aarch64
          path: dist

  # musl x86_64 and i686 need no cross-compilation at all: a musl container
  # on a glibc host is the same CPU, just a different libc, so Docker runs it
  # natively. That means these use the real, actively-maintained PyPA
  # musllinux_1_2 images (republished 2026-09-14) rather than
  # ghcr.io/rust-cross/musllinux_1_2-cross, which despite its name copies
  # /opt/python out of the musllinux_1_1 images PyPA retired on 2024-11-01
  # and so is permanently frozen at CPython 3.13.
  #
  # armv7 is the one musl target with no native runner, so it keeps the
  # -cross image and the CPython-from-source cap that comes with it -- see
  # the config job's cpython_source_built output.
  #
  # This mirrors how the glibc side is already split: native PyPA images
  # wherever a runner of the right architecture exists, *-cross only for
  # the targets where one doesn't.
  musllinux:
    runs-on: ubuntu-22.04
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          # sccache: false on the native-musl leg. sccache publishes no
          # musllinux wheel for any architecture (only manylinux/macOS/
          # Windows), so maturin-action's install step fails outright inside a
          # real musl container: "Because sccache>=0.10.0 has no wheels with a
          # matching platform tag (e.g. musllinux_1_2_aarch64)". armv7 keeps it
          # -- its rust-cross image is a glibc host with a cross-toolchain, so
          # the manylinux wheel installs there.
          - target: x86_64
            pyset: all
            container: quay.io/pypa/musllinux_1_2_x86_64
            sccache: false
          - target: armv7
            container: ghcr.io/rust-cross/musllinux_1_2-cross:armv7
            pyset: source_built
            sccache: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      # Explicit `--interpreter` list instead of --find-interpreter: on the
      # armv7 -cross image, --find-interpreter doesn't verify what's actually
      # present before attempting a build, so it always tries (and fails on)
      # versions that aren't there. The native legs pass the full canonical
      # list, which their image really does carry.
      #
      # --auditwheel=warn: see the matching comment in the linux job -- same
      # risk of maturin relocating libsqlite3 into a private copy for _core
      # alone, leaving the clone module/LIBSQLITE3_PATH pointing at a
      # different, stale one.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist --auditwheel=warn
            ${{ matrix.platform.pyset == 'source_built'
            && needs.config.outputs.cpython_source_built_i_args
            || needs.config.outputs.all_i_args }}
          sccache: ${{ matrix.platform.sccache && !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
          container: ${{ matrix.platform.container }}
      # Not tested inline: these wheels are tagged musllinux_1_2_* for musl
      # libc (Alpine) systems, but this runner is a standard glibc Ubuntu
      # host -- pip would refuse to install them at all (incompatible
      # platform tag), regardless of matching CPU architecture. x86_64 is
      # tested in its own musl container job below.
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  # Split out of the musllinux job for the same reason linux-aarch64 is split
  # out of linux: ubuntu-24.04-arm is a genuine ARM64 runner, so the native
  # PyPA musllinux_1_2_aarch64 image runs without QEMU or cross-gcc, and
  # carries the full CPython set.
  musllinux-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: config
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: >-
            --release --out dist --auditwheel=warn
            ${{ needs.config.outputs.all_i_args }}
          # See the musllinux job: sccache has no musllinux wheel, so it
          # cannot be installed inside this container.
          sccache: false
          manylinux: musllinux_1_2
          container: quay.io/pypa/musllinux_1_2_aarch64
      # Tested in test-musllinux-aarch64 below, not inline: this runner is a
      # glibc host, so pip would reject the musllinux platform tag here.
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-aarch64
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      # This is the one job that can't read its version list from the config
      # job: it needs each interpreter's exact path, which only a per-version
      # actions/setup-python step exposes (its `python-path` output), and
      # Actions has no way to loop over a `uses:` step. The guard step below
      # fails the job if these hardcoded versions ever drift from the
      # canonical list, so the config job stays authoritative even here.
      #
      # Exact interpreter paths rather than bare version numbers (which is
      # what every other job passes maturin) because of a real collision hit
      # in CI: once both a regular and a free-threaded build of the same X.Y
      # version were installed (e.g. plain "3.15" and "3.15t"), interpreter
      # *discovery* only ever found the free-threaded one -- confirmed from
      # build logs, this runner's actions/setup-python evidently registers a
      # free-threaded install in a way that shadows the regular one of the
      # same version, so plain "CPython 3.14"/"3.15" silently vanished from
      # what got built. update-environment: false on every step below keeps
      # each install from touching PATH/registry at all, so only the explicit
      # paths matter -- no discovery, no shadowing, no dependence on install
      # order.
      #
      # Every version below installs on all three targets, including
      # windows-11-arm: CPython's official Windows ARM64 installers start at
      # 3.11, which is now also this project's own minimum, so no step here
      # needs to be allowed to fail.
      - id: py311
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.platform.python_arch }}
          update-environment: false
      - id: py312
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}
          update-environment: false
      - id: py313
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
          update-environment: false
      - id: py314
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.python_arch }}
          update-environment: false
      - id: py315
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          architecture: ${{ matrix.platform.python_arch }}
          allow-prereleases: true
          update-environment: false
      - id: py315t
        uses: actions/setup-python@v6
        with:
          python-version: "3.15t"
          architecture: ${{ matrix.platform.python_arch }}
          allow-prereleases: true
          update-environment: false
      - uses: astral-sh/setup-uv@v7
      # Keeps the hardcoded steps above honest against the config job, since
      # they're the one place the canonical list has to be repeated.
      - name: Check interpreter steps match the canonical list
        shell: bash
        run: |
          set -euo pipefail
          declared="3.11 3.12 3.13 3.14 3.15 3.15t"
          canonical="${{ needs.config.outputs.all_spaced }}"
          if [ "$declared" != "$canonical" ]; then
            echo "::error::The setup-python steps in this job are out of sync with the config job."
            echo "  steps declare: $declared"
            echo "  config job:    $canonical"
            echo "Add or remove a setup-python step above (and update this guard) to match."
            exit 1
          fi
      # Builds the interpreter list from each setup-python step's own
      # python-path output. Every step above is expected to install on all
      # three targets, so the empty-output check is now only a guard against
      # passing maturin a literal flag with nothing after it.
      - name: Compute interpreter list
        id: interpreters
        shell: bash
        run: |
          set -euo pipefail
          args="--release --out dist"
          for p in \
            "${{ steps.py311.outputs.python-path }}" \
            "${{ steps.py312.outputs.python-path }}" \
            "${{ steps.py313.outputs.python-path }}" \
            "${{ steps.py314.outputs.python-path }}" \
            "${{ steps.py315.outputs.python-path }}" \
            "${{ steps.py315t.outputs.python-path }}"; do
            if [ -n "$p" ]; then
              args="$args -i $p"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ steps.interpreters.outputs.args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # All three targets run natively here (windows-11-arm is a genuine
      # ARM64 runner, not emulated, and x86 runs at native speed under
      # WOW64), but only x64 is tested, in its own dedicated
      # test-windows-x64 job below. Now that sqlite-rs has no runtime
      # dependencies, win32 and win_arm64 are testable too -- adding those
      # jobs is a straightforward follow-up, weighed against the README's
      # note that Windows runners queue rather than run in parallel.
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      # Exact interpreter paths, one setup-python step per version, exactly as
      # the windows job does -- and for a reason specific to this project
      # rather than to maturin.
      #
      # build.rs has to compile CPython's own _sqlite3 sources against the
      # headers of the interpreter being built for. resolve_python() gets that
      # interpreter from pyo3_build_config, and when that yields nothing it
      # falls back to whatever `python3` is first on PATH. Passing maturin a
      # bare version (`--interpreter 3.11`) leaves pyo3's config without an
      # executable on macOS, so the fallback won -- CI built 3.11 against
      # 3.15t's headers, and the `_sqlite3.so` in the resulting wheel
      # referenced symbols its own interpreter does not export. Passing an
      # absolute path puts that path in pyo3's config, so build.rs resolves
      # the right headers.
      #
      # update-environment: false on every step keeps each install off PATH,
      # so the fallback can never silently pick a different interpreter again.
      # The guard step below keeps these hardcoded versions in sync with the
      # config job, since Actions cannot loop over a `uses:` step.
      - id: py311
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          update-environment: false
      - id: py312
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          update-environment: false
      - id: py313
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          update-environment: false
      - id: py314
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          update-environment: false
      - id: py315
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true
          update-environment: false
      - id: py315t
        uses: actions/setup-python@v6
        with:
          python-version: "3.15t"
          allow-prereleases: true
          update-environment: false
      - uses: astral-sh/setup-uv@v7
      - name: Check interpreter steps match the canonical list
        shell: bash
        run: |
          set -euo pipefail
          declared="3.11 3.12 3.13 3.14 3.15 3.15t"
          canonical="${{ needs.config.outputs.all_spaced }}"
          if [ "$declared" != "$canonical" ]; then
            echo "::error::The setup-python steps in this job are out of sync with the config job."
            echo "  steps declare: $declared"
            echo "  config job:    $canonical"
            exit 1
          fi
      - name: Compute interpreter list
        id: interpreters
        shell: bash
        run: |
          set -euo pipefail
          args="--release --out dist"
          for p in \
            "${{ steps.py311.outputs.python-path }}" \
            "${{ steps.py312.outputs.python-path }}" \
            "${{ steps.py313.outputs.python-path }}" \
            "${{ steps.py314.outputs.python-path }}" \
            "${{ steps.py315.outputs.python-path }}" \
            "${{ steps.py315t.outputs.python-path }}"; do
            if [ -n "$p" ]; then
              args="$args -i $p"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ steps.interpreters.outputs.args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Both targets run natively here (macos-15-intel is genuinely x86_64,
      # macos-latest is genuinely Apple Silicon), no QEMU concern. Tested in
      # their own dedicated test-macos-x86_64/test-macos-aarch64 jobs below.
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  # One test job per native platform, each with its own Python-version
  # matrix expanded from the config job -- installing/testing every wheel
  # each build job actually produced, rather than only whichever interpreter
  # that job's own setup-python happened to resolve. Separate jobs (not extra
  # steps in the build jobs above) so a version's setup-python/install/test
  # doesn't force a matrix dimension onto the build step itself, which
  # already builds every version in one maturin invocation.
  #
  # See the config job for why `tested` drops 3.15/3.15t, and why
  # `tested_windows` is kept as a separate output even though it currently
  # resolves to the same list.
  test-linux-x86_64:
    needs: [config, linux]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15/3.15t have no GA release yet; harmless for the others.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install built wheel
        run: uv pip install --system --find-links dist sqlite-rs
      - name: Install test dependencies
        run: uv pip install --system --group test
      - name: Run tests
        run: pytest tests/

  test-linux-aarch64:
    needs: [config, linux-aarch64]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-aarch64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15/3.15t have no GA release yet; harmless for the others.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install built wheel
        run: uv pip install --system --find-links dist sqlite-rs
      - name: Install test dependencies
        run: uv pip install --system --group test
      - name: Run tests
        run: pytest tests/

  test-macos-x86_64:
    needs: [config, macos]
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-macos-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15/3.15t have no GA release yet; harmless for the others.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install built wheel
        run: uv pip install --system --find-links dist sqlite-rs
      - name: Install test dependencies
        run: uv pip install --system --group test
      - name: Run tests
        run: pytest tests/

  test-macos-aarch64:
    needs: [config, macos]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15/3.15t have no GA release yet; harmless for the others.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install built wheel
        run: uv pip install --system --find-links dist sqlite-rs
      - name: Install test dependencies
        run: uv pip install --system --group test
      - name: Run tests
        run: pytest tests/

  test-windows-x64:
    needs: [config, windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested_windows) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          # 3.15 has no GA release yet; harmless for the others.
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install built wheel
        run: uv pip install --system --find-links dist sqlite-rs
      - name: Install test dependencies
        run: uv pip install --system --group test
      - name: Run tests
        run: pytest tests/

  # musl wheels can't be tested the way every other platform's are: the
  # runner is glibc, so pip rejects the musllinux_1_2_* platform tag outright.
  # These two jobs run the tests inside the PyPA musllinux_1_2 image instead.
  #
  # `docker run` in a step rather than the job-level `container:` key on
  # purpose. With `container:`, the Actions runner injects its own
  # glibc-linked Node to execute every `uses:` step, which does not run on
  # musl -- checkout and download-artifact would fail before any test did.
  # Running the container from a step keeps those actions on the glibc host
  # and puts only the tests inside musl.
  #
  # One job per architecture looping over versions, rather than this file's
  # usual job-per-version matrix: the image is ~1GB and a matrix would pull
  # it once per version. This also matches the README's note that more jobs
  # queue rather than parallelize.
  #
  # Only x86_64 and aarch64 are covered -- both have a native runner. i686
  # and armv7 would need QEMU, the same reason their glibc counterparts go
  # untested.
  test-musllinux-x86_64:
    needs: [config, musllinux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - name: Run tests in musllinux_1_2 container
        env:
          VERSIONS: ${{ needs.config.outputs.tested_spaced }}
        run: |
          set -euo pipefail
          docker run --rm -e VERSIONS -v "$PWD:/io" -w /io \
            quay.io/pypa/musllinux_1_2_x86_64 /io/.github/musl-test.sh

  test-musllinux-aarch64:
    needs: [config, musllinux-aarch64]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-musllinux-aarch64
          path: dist
      - name: Run tests in musllinux_1_2 container
        env:
          VERSIONS: ${{ needs.config.outputs.tested_spaced }}
        run: |
          set -euo pipefail
          docker run --rm -e VERSIONS -v "$PWD:/io" -w /io \
            quay.io/pypa/musllinux_1_2_aarch64 /io/.github/musl-test.sh

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, linux-aarch64, musllinux, musllinux-aarch64, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

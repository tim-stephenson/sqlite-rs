# Scaffolded once by `maturin generate-ci github`; heavily rewritten since.
# Do NOT regenerate -- that emits ~186 lines and would discard the config job,
# every test job, and the pinned images and flags below.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: it publishes to PyPI.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.versions.outputs.all }}
      all_spaced: ${{ steps.versions.outputs.all_spaced }}
      all_i_args: ${{ steps.versions.outputs.all_i_args }}
      cpython_source_built_i_args: ${{ steps.versions.outputs.cpython_source_built_i_args }}
      tested: ${{ steps.versions.outputs.tested }}
      tested_spaced: ${{ steps.versions.outputs.tested_spaced }}
    steps:
      - id: versions
        shell: bash
        run: |
          set -euo pipefail

          # The only place Python versions are written down.
          ALL="3.11 3.12 3.13 3.14 3.15 3.15t"

          # emit <name> [exclude...] -> $name (JSON), ${name}_spaced, ${name}_i_args
          emit() {
            local name="$1"; shift
            local excluded=" $* " keep="" v
            for v in $ALL; do
              case "$excluded" in *" $v "*) continue ;; esac
              keep="${keep:+$keep }$v"
            done
            {
              echo "$name=$(printf '%s\n' $keep | jq -Rsc 'split("\n") | map(select(length > 0))')"
              echo "${name}_spaced=$keep"
              echo "${name}_i_args=$(for v in $keep; do printf -- '-i python%s ' "$v"; done)"
            } >> "$GITHUB_OUTPUT"
            printf '%-22s %s\n' "$name" "$keep" >> "$GITHUB_STEP_SUMMARY"
          }

          emit all
          # armv7, both libcs: rust-cross compiles CPython from source instead
          # of copying a PyPA image, and that list stops at 3.14 with no
          # free-threaded build. Not fixable from here.
          emit cpython_source_built 3.15 3.15t
          emit tested

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      # Needed for build.rs's generated stubs, not for the compiled module.
      - run: uv run maturin develop --uv
      - run: uv run basedpyright . --warnings

  linux:
    runs-on: ubuntu-22.04
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64, manylinux: "2_28", pyset: all }
          - { target: x86, manylinux: "2_28", pyset: all }
          - { target: armv7, manylinux: "2_28", pyset: source_built }
          # maturin-action has no riscv64 cross-image mapping; name it.
          - { target: riscv64, manylinux: "2_39", pyset: all, container: "ghcr.io/rust-cross/manylinux_2_39-cross:riscv64" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      # --auditwheel=warn, never repair: repair privatises libsqlite3 for _core
      # alone, splitting it from the clone module and LIBSQLITE3_PATH, which
      # segfaults when a sqlite3* crosses. =skip would lose the compliance tag.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist --auditwheel=warn
            ${{ matrix.platform.pyset == 'source_built'
            && needs.config.outputs.cpython_source_built_i_args
            || needs.config.outputs.all_i_args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  # Split from `linux` so test-linux-aarch64 waits only on its own wheel.
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: config
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --auditwheel=warn ${{ needs.config.outputs.all_i_args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: "2_28"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-aarch64
          path: dist

  musllinux:
    runs-on: ubuntu-22.04
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The PyPA image must be named: `manylinux: musllinux_1_2` alone
          # selects an Ubuntu image whose system Python gets used instead.
          # sccache publishes no musllinux wheel so it cannot install there;
          # armv7's rust-cross image is glibc, so it keeps sccache.
          - { target: x86_64, pyset: all, container: "quay.io/pypa/musllinux_1_2_x86_64", sccache: false }
          - { target: armv7, pyset: source_built, container: "ghcr.io/rust-cross/musllinux_1_2-cross:armv7", sccache: true }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist --auditwheel=warn
            ${{ matrix.platform.pyset == 'source_built'
            && needs.config.outputs.cpython_source_built_i_args
            || needs.config.outputs.all_i_args }}
          sccache: ${{ matrix.platform.sccache && !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
          container: ${{ matrix.platform.container }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  musllinux-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: config
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --auditwheel=warn ${{ needs.config.outputs.all_i_args }}
          sccache: false
          manylinux: musllinux_1_2
          container: quay.io/pypa/musllinux_1_2_aarch64
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-aarch64
          path: dist

  # One setup-python step per version, passing maturin absolute -i paths. A
  # bare `--interpreter 3.11` leaves pyo3's config without an executable, so
  # build.rs falls back to the first python3 on PATH and compiles CPython's
  # _sqlite sources against the wrong headers; update-environment: false keeps
  # every install off PATH so that fallback cannot fire. Actions cannot loop
  # over `uses:`, so the list is repeated here and the step below fails the
  # job if it drifts from the config job.
  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, target: x64, python_arch: x64 }
          - { runner: windows-latest, target: x86, python_arch: x86 }
          - { runner: windows-11-arm, target: aarch64, python_arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - { id: py311, uses: actions/setup-python@v6, with: { python-version: "3.11", architecture: "${{ matrix.platform.python_arch }}", update-environment: false } }
      - { id: py312, uses: actions/setup-python@v6, with: { python-version: "3.12", architecture: "${{ matrix.platform.python_arch }}", update-environment: false } }
      - { id: py313, uses: actions/setup-python@v6, with: { python-version: "3.13", architecture: "${{ matrix.platform.python_arch }}", update-environment: false } }
      - { id: py314, uses: actions/setup-python@v6, with: { python-version: "3.14", architecture: "${{ matrix.platform.python_arch }}", update-environment: false } }
      - { id: py315, uses: actions/setup-python@v6, with: { python-version: "3.15", architecture: "${{ matrix.platform.python_arch }}", allow-prereleases: true, update-environment: false } }
      - { id: py315t, uses: actions/setup-python@v6, with: { python-version: "3.15t", architecture: "${{ matrix.platform.python_arch }}", allow-prereleases: true, update-environment: false } }
      - uses: astral-sh/setup-uv@v7
      - id: interpreters
        shell: bash
        run: |
          set -euo pipefail
          declared="3.11 3.12 3.13 3.14 3.15 3.15t"
          canonical="${{ needs.config.outputs.all_spaced }}"
          if [ "$declared" != "$canonical" ]; then
            echo "::error::setup-python steps ($declared) out of sync with config job ($canonical)"
            exit 1
          fi
          args="--release --out dist"
          for p in "${{ steps.py311.outputs.python-path }}" "${{ steps.py312.outputs.python-path }}" \
                   "${{ steps.py313.outputs.python-path }}" "${{ steps.py314.outputs.python-path }}" \
                   "${{ steps.py315.outputs.python-path }}" "${{ steps.py315t.outputs.python-path }}"; do
            if [ -n "$p" ]; then args="$args -i $p"; fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ steps.interpreters.outputs.args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  # Absolute -i paths, for the reason given on the windows job.
  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - { id: py311, uses: actions/setup-python@v6, with: { python-version: "3.11", update-environment: false } }
      - { id: py312, uses: actions/setup-python@v6, with: { python-version: "3.12", update-environment: false } }
      - { id: py313, uses: actions/setup-python@v6, with: { python-version: "3.13", update-environment: false } }
      - { id: py314, uses: actions/setup-python@v6, with: { python-version: "3.14", update-environment: false } }
      - { id: py315, uses: actions/setup-python@v6, with: { python-version: "3.15", allow-prereleases: true, update-environment: false } }
      - { id: py315t, uses: actions/setup-python@v6, with: { python-version: "3.15t", allow-prereleases: true, update-environment: false } }
      - uses: astral-sh/setup-uv@v7
      - id: interpreters
        shell: bash
        run: |
          set -euo pipefail
          declared="3.11 3.12 3.13 3.14 3.15 3.15t"
          canonical="${{ needs.config.outputs.all_spaced }}"
          if [ "$declared" != "$canonical" ]; then
            echo "::error::setup-python steps ($declared) out of sync with config job ($canonical)"
            exit 1
          fi
          args="--release --out dist"
          for p in "${{ steps.py311.outputs.python-path }}" "${{ steps.py312.outputs.python-path }}" \
                   "${{ steps.py313.outputs.python-path }}" "${{ steps.py314.outputs.python-path }}" \
                   "${{ steps.py315.outputs.python-path }}" "${{ steps.py315t.outputs.python-path }}"; do
            if [ -n "$p" ]; then args="$args -i $p"; fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ steps.interpreters.outputs.args }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  # Only targets with a native runner are tested: i686, win32 and win_arm64
  # have no test job, and armv7/riscv64 would need QEMU.
  test-linux-x86_64:
    needs: [config, linux]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv pip install --system --find-links dist sqlite-rs
          uv pip install --system --group test
          pytest tests/

  test-linux-aarch64:
    needs: [config, linux-aarch64]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-aarch64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv pip install --system --find-links dist sqlite-rs
          uv pip install --system --group test
          pytest tests/

  test-macos:
    needs: [config, macos]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv pip install --system --find-links dist sqlite-rs
          uv pip install --system --group test
          pytest tests/

  test-windows-x64:
    needs: [config, windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.tested) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv pip install --system --find-links dist sqlite-rs
          uv pip install --system --group test
          pytest tests/

  # `docker run` from a step, not the job-level `container:` key: that injects
  # a glibc-linked Node to run every `uses:` step, which cannot execute on musl.
  test-musllinux-x86_64:
    needs: [config, musllinux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - env:
          VERSIONS: ${{ needs.config.outputs.tested_spaced }}
        run: |
          set -euo pipefail
          docker run --rm -e VERSIONS -v "$PWD:/io" -w /io \
            quay.io/pypa/musllinux_1_2_x86_64 /io/.github/musl-test.sh

  test-musllinux-aarch64:
    needs: [config, musllinux-aarch64]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-musllinux-aarch64
          path: dist
      - env:
          VERSIONS: ${{ needs.config.outputs.tested_spaced }}
        run: |
          set -euo pipefail
          docker run --rm -e VERSIONS -v "$PWD:/io" -w /io \
            quay.io/pypa/musllinux_1_2_aarch64 /io/.github/musl-test.sh

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, linux-aarch64, musllinux, musllinux-aarch64, windows, macos, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

# Manual: the fixture takes minutes to build and the run is not a pass/fail.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows in the fixture
        default: "10000000"

# One interpreter: the numbers are about the fetch path, which does not vary
# by version, and building the fixture for each would be minutes apiece.
env:
  PYTHON_VERSION: "3.14"

jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group bench
      - run: uv run maturin develop --uv --release
      # Temporary, with the diagnostic itself.
      - shell: bash
        run: uv run python scripts/diagnose_ffi.py | tee ffi.txt
      - id: run
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/benchmark_fetch_all.py --rows "${{ inputs.rows }}" | tee result.txt
      - shell: bash
        run: |
          {
            echo "### ${{ matrix.runner }} -- ${{ runner.arch }}, Python ${{ env.PYTHON_VERSION }}"
            echo '```'
            cat result.txt
            cat ffi.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# Manual: the fixture takes minutes to build and the run is not a pass/fail.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows in the read fixture
        default: "10000000"
      insert_rows:
        description: Rows in the insert fixture
        default: "2000000"
      diagnose:
        description: Also run the per-phase insert diagnostic
        type: boolean
        default: false

# One interpreter: the numbers are about the read and insert paths, neither of
# which varies by version, and building the fixture for each would be minutes
# apiece.
env:
  PYTHON_VERSION: "3.14"

jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group bench
      - run: uv run maturin develop --uv --release
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/benchmark_fetch_all.py --rows "${{ inputs.rows }}" | tee read.txt
      # Separately, because the insert fixture is built in memory and the read
      # fixture is on disk: running them in one process would peak at the sum.
      - id: insert
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/benchmark_insert.py --rows "${{ inputs.insert_rows }}" | tee insert.txt
      - id: diagnose
        if: ${{ inputs.diagnose }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/diagnose_insert.py | tee diagnose.txt
      - shell: bash
        run: |
          {
            echo "### ${{ matrix.runner }} -- ${{ runner.arch }}, Python ${{ env.PYTHON_VERSION }}"
            echo "#### Query -- ${{ inputs.rows }} rows"
            echo '```'
            cat read.txt
            echo '```'
            echo "#### Insert -- ${{ inputs.insert_rows }} rows"
            echo '```'
            cat insert.txt
            echo '```'
            if [ -f diagnose.txt ]; then
              echo "#### Diagnostic"
              echo '```'
              cat diagnose.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

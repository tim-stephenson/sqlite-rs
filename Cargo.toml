[package]
name = "sqlite-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A drop-in superset of Python's sqlite3 bindings, extended with Rust for performant Arrow interoperability."
repository = "https://github.com/tim-stephenson/sqlite-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
arrow-array = "59"
arrow-cast = "59"
arrow-data = "59"
arrow-schema = "59"
pyo3 = "0.29.0"
pyo3-arrow = "0.19.0"
rusqlite = { version = "0.40.2", default-features = false } # default-features = false: the defaults pull a wasm toolchain we never use.

[build-dependencies]
cc = "1"
pyo3-build-config = "0.29.0"


[package]
name = "sqlite-rs"
version = "0.1.0"
edition = "2024"
# Older toolchains write a Mach-O whose string table follows the indirect
# symbol table unpadded, which macOS 27's dyld rejects outright whenever the
# symbol count is odd ("mis-aligned LINKEDIT string pool"). Half of all builds,
# by chance. Fixed in 1.98 (rust-lang/rust#157750).
rust-version = "1.98"
license = "MIT"
# Not published to crates.io -- this crate only ever gets compiled into the
# _core extension module and shipped inside a Python wheel. These are here
# because maturin builds the sdist by shelling out to `cargo package --list`,
# and Cargo warns on every such run when a manifest carries none of
# description/documentation/homepage/repository.
description = "A drop-in superset of Python's sqlite3 bindings, extended with Rust."
repository = "https://github.com/tim-stephenson/sqlite-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
arrow-array = "59"
arrow-cast = "59"
arrow-schema = "59"
pyo3 = "0.29.0"
pyo3-arrow = "0.19.0"
# default-features = false: the defaults pull a wasm toolchain we never use.
rusqlite = { version = "0.40.2", default-features = false }

[build-dependencies]
cc = "1"
pyo3-build-config = "0.29.0"

# EXPERIMENT, every platform: narrow to wherever it earns its place. The fetch
# grows one buffer per column by doubling, which HeapReAlloc cannot do in place
# for a large block, and against ADBC -- which fills fixed batches and never
# grows one -- sqlite_rs is worth 2.3x on Linux but only 1.4x on Windows.
# Default features are mimalloc v3.
[dependencies.mimalloc]
version = "0.1.52"
